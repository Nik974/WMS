<app-header />

<main class="page">
  <h1>Welcome, {{ auth.session()?.username }}</h1>

  <nav class="tiles">
    @for (tile of tiles; track tile.link) {
      @if (tile.enabled) {
        <a mat-flat-button class="tile" [routerLink]="tile.link">
          <mat-icon>{{ tile.icon }}</mat-icon>
          {{ tile.label }}
        </a>
      } @else {
        <button mat-flat-button class="tile" disabled>
          <mat-icon>{{ tile.icon }}</mat-icon>
          {{ tile.label }}
        </button>
      }
    }
  </nav>
</main>
