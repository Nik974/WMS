<mat-toolbar>
  <a mat-button class="brand" routerLink="/dashboard">WMS</a>

  <span class="desktop-only">
    <a mat-button routerLink="/products">Products</a>
    <a mat-button routerLink="/categories">Categories</a>
    <a mat-button routerLink="/warehouses">Warehouses</a>
    <a mat-button routerLink="/orders">Orders</a>
  </span>

  <span class="spacer"></span>

  <span class="user desktop-only">{{ auth.session()?.username }} ({{ auth.session()?.role }})</span>
  <button mat-button class="desktop-only" (click)="logout()">Log out</button>

  <button mat-icon-button class="mobile-only" [matMenuTriggerFor]="menu" aria-label="Menu">
    <mat-icon>menu</mat-icon>
  </button>

  <mat-menu #menu="matMenu">
    <div class="menu-user" mat-menu-item disabled>
      {{ auth.session()?.username }} ({{ auth.session()?.role }})
    </div>
    <a mat-menu-item routerLink="/products">Products</a>
    <a mat-menu-item routerLink="/categories">Categories</a>
    <a mat-menu-item routerLink="/warehouses">Warehouses</a>
    <a mat-menu-item routerLink="/customers">Customers</a>
    <a mat-menu-item routerLink="/orders">Orders</a>
    <button mat-menu-item (click)="logout()">Log out</button>
  </mat-menu>
</mat-toolbar>
