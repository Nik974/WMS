<app-header/>

<main class="page">
  <div class="page-header">
    <h1>Audit log</h1>
  </div>

  <mat-expansion-panel class="filters" expanded>
    <mat-expansion-panel-header>
      <mat-panel-title>Search</mat-panel-title>
    </mat-expansion-panel-header>

    <form [formGroup]="filterForm" class="filter-row">
      <mat-form-field appearance="outline">
        <mat-label>User</mat-label>
        <input matInput formControlName="user"/>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Section</mat-label>
        <mat-select formControlName="resource">
          <mat-option value="">All</mat-option>
          @for (r of resources; track r) {
            <mat-option [value]="r">{{ r }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>From</mat-label>
        <input matInput type="date" formControlName="from"/>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>To</mat-label>
        <input matInput type="date" formControlName="to"/>
      </mat-form-field>

      <button mat-button type="button" (click)="clearFilters()">Clear</button>
    </form>
  </mat-expansion-panel>

  <div class="table-card">
    <table mat-table [dataSource]="rows()">
      <ng-container matColumnDef="time">
        <th mat-header-cell *matHeaderCellDef>Time</th>
        <td mat-cell *matCellDef="let e" class="nowrap">{{ e.createdAt | date: 'dd.MM.yyyy HH:mm:ss' }}</td>
      </ng-container>

      <ng-container matColumnDef="user">
        <th mat-header-cell *matHeaderCellDef>User</th>
        <td mat-cell *matCellDef="let e">
          <div>{{ e.username }}</div>
          <div class="email">{{ e.email }}</div>
        </td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let e">{{ text(e) }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="empty" [attr.colspan]="columns.length">
          {{ loading() ? 'Loading...' : 'No entries found' }}
        </td>
      </tr>
    </table>

    <mat-paginator
      [length]="total()"
      [pageIndex]="pageIndex()"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[10, 25, 50, 100]"
      (page)="onPage($event)"
      aria-label="Select page"/>
  </div>
</main>
