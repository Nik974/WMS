<app-header />

<main class="page">
  <div class="page-header">
    <h1>Customers</h1>
    @if (canEdit()) {
      <button mat-flat-button (click)="openDialog()">
        <mat-icon>add</mat-icon> Add customer
      </button>
    }
  </div>

  <mat-expansion-panel class="filters">
    <mat-expansion-panel-header>
      <mat-panel-title>Search</mat-panel-title>
    </mat-expansion-panel-header>

    <div class="filter-row">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput [formControl]="search" />
      </mat-form-field>
      <button mat-button type="button" (click)="search.reset('')">Clear</button>
    </div>
  </mat-expansion-panel>

  <div class="table-card">
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="customerName">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let c">{{ c.customerName }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let c">
          @if (canEdit()) {
            <button mat-icon-button (click)="openDialog(c)" aria-label="Edit customer">
              <mat-icon>edit</mat-icon>
            </button>
          }
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="empty" [attr.colspan]="columns.length">
          {{ loading() ? 'Loading...' : 'No customers found' }}
        </td>
      </tr>
    </table>

    <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page" />
  </div>
</main>
