<app-header />

<main class="page">
  <div class="page-header">
    <h1>Warehouses</h1>
    @if (canEdit()) {
      <button mat-flat-button (click)="openDialog()">
        <mat-icon>add</mat-icon> Add warehouse
      </button>
    }
  </div>

  <mat-expansion-panel class="filters">
    <mat-expansion-panel-header>
      <mat-panel-title>Search</mat-panel-title>
    </mat-expansion-panel-header>

    <form [formGroup]="filterForm" class="filter-row">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Address</mat-label>
        <input matInput formControlName="address" />
      </mat-form-field>
      <button mat-button type="button" (click)="clearFilters()">Clear</button>
    </form>
  </mat-expansion-panel>

  <div class="table-card">
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="warehouseName">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let w">{{ w.warehouseName }}</td>
      </ng-container>

      <ng-container matColumnDef="warehouseAddress">
        <th mat-header-cell *matHeaderCellDef>Address</th>
        <td mat-cell *matCellDef="let w">{{ w.warehouseAddress }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let w">
          @if (canEdit()) {
            <button mat-icon-button (click)="openDialog(w)" aria-label="Edit warehouse">
              <mat-icon>edit</mat-icon>
            </button>
          }
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="empty" [attr.colspan]="columns.length">
          {{ loading() ? 'Loading...' : 'No warehouses found' }}
        </td>
      </tr>
    </table>

    <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page" />
  </div>
</main>
